site_name: CoastDiff
site_url: https://CDR-Forecasting-Stack.github.io/coastdiff/
repo_name: CDR-Forecasting-Stack/coastdiff
repo_url: https://github.com/CDR-Forecasting-Stack/coastdiff
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: Jet Brains Mono

  #favicon: assets/favicon.ico
  #logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    #- toc.follow
    #- toc.integrate # uncomment if want toc scaffolded on left sidebar
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.superfences
  - pymdownx.details # need to make admonitions collapsible
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - attr_list # to make buttons
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: spacy
            show_submodules: false
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_signature: true
            heading_level: 2
            members_order: source
            separate_signature: true
            filters: ["!^_"]
            show_symbol_type_heading: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: ARCHITECTURE.md
